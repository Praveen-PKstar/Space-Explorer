<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Space Explorer 3D</title>

    <link rel="stylesheet"
        href="style.css">
</head>

<body>

    <!-- =========================================
         THREE.JS SPACE
    ========================================= -->

    <div id="space-container"></div>


    <!-- =========================================
         OPENING HERO
         This scrolls away normally
    ========================================= -->

    <section class="hero">

        <div class="hud">

            <h1>SPACE EXPLORER</h1>

            <p>
                3D ASTRONOMICAL JOURNEY
            </p>

            <div class="hint">
                SCROLL TO TRAVEL
            </div>

        </div>

    </section>


    <!-- =========================================
         DESTINATION CAPTION
         Fixed to the screen
    ========================================= -->

    <div
        class="scene-caption"
        id="scene-caption">

        <span
            class="scene-caption__eyebrow"
            id="scene-caption-eyebrow">
        </span>

        <h2 id="scene-caption-title">
        </h2>

    </div>


    <!-- =========================================
         THREE.JS SCRIPT
    ========================================= -->

    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
